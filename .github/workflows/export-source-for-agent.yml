name: Export source for migration

on:
  push:
    branches:
      - agent/openai-codex-migration
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          roots = {"src", "scripts", "tests", "docs", "conductor", ".github"}
          root_files = {
              "README.md", "README_CN.md", "CLAUDE.md", "GEMINI.md", "TODO.md",
              "requirements.txt", "pyproject.toml", "setup.cfg", "pytest.ini",
              "main.py", "main_markdown.py", "app.py", ".gitignore", ".env.example",
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          selected = []
          for name in tracked:
              p = Path(name)
              if name in root_files or (p.parts and p.parts[0] in roots):
                  selected.append(name)
          Path(".agent-source-files.txt").write_text("\n".join(selected) + "\n", encoding="utf-8")
          print(f"Selected {len(selected)} tracked files")
          PY
          tar -czf long-md-writer-source.tgz -T .agent-source-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: long-md-writer-source
          path: long-md-writer-source.tgz
          if-no-files-found: error
          retention-days: 1
