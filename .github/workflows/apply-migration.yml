name: Preserve project data and finalize OpenAI Codex migration

on:
  pull_request:
    branches:
      - master

concurrency:
  group: openai-codex-migration-finalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the migration head
        uses: actions/checkout@v4
        with:
          ref: agent/openai-codex-migration
          fetch-depth: 0

      - name: Snapshot the verified migration runtime
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/apply-migration.yml /tmp/apply-migration.yml
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            -czf /tmp/migration-runtime.tgz .
          test -s /tmp/migration-runtime.tgz

      - name: Rebuild on master while preserving project materials
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master

          # Start from the complete original project tree. This restores user inputs,
          # assets, historical baselines and conductor records that a source-only
          # migration must never delete.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          git checkout origin/master -- .

          # Remove credential-bearing/generated tool state and unequivocal caches.
          rm -rf .agent .claude .gemini .gemini-clipboard
          rm -rf temp_*_ms workspaces/workspace_debug log
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          # Replace only the active implementation and its documentation/tests.
          # Historical project materials outside these paths remain intact.
          rm -rf src/agents src/core src/orchestration scripts tests docs

          # Workflow files are finalized separately through the GitHub connector,
          # because the default Actions token cannot create/replace workflows.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/apply-migration.yml .github/workflows/apply-migration.yml

          tar -xzf /tmp/migration-runtime.tgz

          test -f inputs/prompt.txt
          test -f requirements.txt
          test -f src/orchestration/openai_workflow.py
          test -f src/orchestration/codex_runtime.py
          test -f tests/test_workflow_e2e.py
          test -f docs/SECURITY.md
          test -f .github/workflows/apply-migration.yml
          test ! -e src/agents
          test ! -e src/core
          test ! -e .github/workflows/ci.yml
          test -z "$(find . -maxdepth 1 -type d -name 'temp_*_ms' -print -quit)"
          test ! -e workspaces/workspace_debug

      - name: Install migrated dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Validate the preserved project and new runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests main.py main_markdown.py app.py
          python -m pytest -q
          python main.py --help >/dev/null
          python main_markdown.py --help >/dev/null
          python -m src.orchestration.validate_cli --help >/dev/null

          # Material that defines the previous experiment must still be present.
          test -s inputs/prompt.txt
          test -d assets
          test -d conductor

      - name: Publish the verified tree on top of the latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # Validate only files authored by this migration. Preserved inputs and
          # historical conductor records intentionally remain byte-identical to master,
          # including legacy whitespace that is outside this refactor's scope.
          git diff --cached --check -- \
            .env.example .gitignore AGENTS.md CLAUDE.md GEMINI.md \
            README.md README_CN.md TODO.md app.py main.py main_markdown.py \
            pyproject.toml pytest.ini requirements.txt docs scripts src tests

          # The bootstrap workflow must remain byte-identical in this bot commit;
          # final workflow replacement is performed by the GitHub connector.
          git diff --cached --quiet -- .github/workflows || {
            echo 'workflow files changed unexpectedly' >&2
            exit 1
          }

          # Build the already-validated index into a commit whose parent is the latest
          # remote branch head. This avoids non-fast-forward races with PR metadata or
          # workflow-fix commits made while the validation job was running.
          tree_sha="$(git write-tree)"
          git fetch origin agent/openai-codex-migration
          parent_sha="$(git rev-parse origin/agent/openai-codex-migration)"
          commit_sha="$(printf '%s\n' 'fix: preserve project materials in OpenAI Codex migration' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git push origin "$commit_sha:refs/heads/agent/openai-codex-migration"
