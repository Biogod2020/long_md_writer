name: Preserve project data and finalize OpenAI Codex migration

on:
  pull_request:
    branches:
      - master

concurrency:
  group: openai-codex-migration-finalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the migration head
        uses: actions/checkout@v4
        with:
          ref: agent/openai-codex-migration
          fetch-depth: 0

      - name: Snapshot the verified migration runtime
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/apply-migration.yml /tmp/apply-migration.yml
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.agent' \
            --exclude='./.claude' \
            --exclude='./.gemini' \
            --exclude='./.gemini-clipboard' \
            --exclude='./temp_*_ms' \
            --exclude='./workspaces/workspace_debug' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            -czf /tmp/migration-runtime.tgz .
          test -s /tmp/migration-runtime.tgz

      - name: Rebuild on master while preserving project materials
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master

          # Start from the complete original project tree. This restores user inputs,
          # assets, historical baselines and conductor records that a source-only
          # migration must never delete.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          git checkout origin/master -- .

          # Remove credential-bearing/generated tool state and unequivocal caches.
          rm -rf .agent .claude .gemini .gemini-clipboard log
          find . -maxdepth 1 -type d -name 'temp_*_ms' -exec rm -rf -- {} +
          find . -type d -name __pycache__ -print0 | xargs -0 -r rm -rf
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf workspaces/workspace_debug

          # Replace only the active implementation and its documentation/tests.
          # Historical project materials outside these paths remain intact.
          rm -rf src/agents src/core src/orchestration scripts tests docs

          # Workflow files are finalized separately through the GitHub connector,
          # because the default Actions token cannot create/replace workflows.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/apply-migration.yml .github/workflows/apply-migration.yml

          tar -xzf /tmp/migration-runtime.tgz

          # Defence in depth: a stale migration snapshot must not resurrect caches.
          rm -rf .agent .claude .gemini .gemini-clipboard log
          find . -maxdepth 1 -type d -name 'temp_*_ms' -exec rm -rf -- {} +
          find . -type d -name __pycache__ -print0 | xargs -0 -r rm -rf
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf workspaces/workspace_debug

          python - <<'PY'
          from pathlib import Path

          required_files = [
              'inputs/prompt.txt',
              'requirements.txt',
              'src/orchestration/openai_workflow.py',
              'src/orchestration/codex_runtime.py',
              'tests/test_workflow_e2e.py',
              'docs/SECURITY.md',
              '.github/workflows/apply-migration.yml',
          ]
          required_dirs = ['assets', 'conductor']
          forbidden_paths = [
              'src/agents',
              'src/core',
              '.github/workflows/ci.yml',
              'workspaces/workspace_debug',
              '.agent',
              '.claude',
              '.gemini',
              '.gemini-clipboard',
          ]

          errors = []
          for raw in required_files:
              if not Path(raw).is_file():
                  errors.append(f'missing required file: {raw}')
          for raw in required_dirs:
              if not Path(raw).is_dir():
                  errors.append(f'missing required directory: {raw}')
          for raw in forbidden_paths:
              if Path(raw).exists():
                  errors.append(f'forbidden legacy/generated path remains: {raw}')

          temp_dirs = sorted(str(path) for path in Path('.').glob('temp_*_ms') if path.is_dir())
          if temp_dirs:
              errors.append(f'temporary model-output directories remain: {temp_dirs}')

          if errors:
              print('Rebuilt tree validation failed:')
              for error in errors:
                  print(f' - {error}')
              raise SystemExit(1)

          print('Rebuilt tree contract passed.')
          PY

      - name: Install migrated dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Validate the preserved project and new runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests main.py main_markdown.py app.py
          python -m pytest -q
          python main.py --help >/dev/null
          python main_markdown.py --help >/dev/null
          python -m src.orchestration.validate_cli --help >/dev/null
          test -s inputs/prompt.txt
          test -d assets
          test -d conductor

      - name: Publish the verified tree on top of the latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          git diff --cached --check -- \
            .env.example .gitignore AGENTS.md CLAUDE.md GEMINI.md \
            README.md README_CN.md TODO.md app.py main.py main_markdown.py \
            pyproject.toml pytest.ini requirements.txt docs scripts src tests

          git diff --cached --quiet -- .github/workflows || {
            echo 'workflow files changed unexpectedly' >&2
            exit 1
          }

          tree_sha="$(git write-tree)"
          git fetch origin agent/openai-codex-migration
          parent_sha="$(git rev-parse origin/agent/openai-codex-migration)"
          commit_sha="$(printf '%s\n' 'fix: preserve project materials in OpenAI Codex migration' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git push origin "$commit_sha:refs/heads/agent/openai-codex-migration"
