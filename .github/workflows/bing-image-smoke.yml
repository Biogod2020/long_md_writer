name: Bing image sourcing smoke

on:
  push:
    branches:
      - agent/openai-codex-migration
    paths:
      - .github/workflows/bing-image-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bing-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and image validator
        run: python -m pip install lxml Pillow
      - name: Search Bing Images, download one original, and validate it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from io import BytesIO
          import hashlib
          import html as html_std
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request

          from lxml import html as lxml_html
          from PIL import Image

          QUERY = "cardiac conduction system diagram site:commons.wikimedia.org"
          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/150.0 Safari/537.36"
          )
          MAX_BYTES = 12 * 1024 * 1024
          output = Path("bing-smoke")
          output.mkdir(parents=True, exist_ok=True)

          search_url = "https://www.bing.com/images/search?" + urllib.parse.urlencode(
              {
                  "q": QUERY,
                  "form": "HDRSC2",
                  "first": "1",
                  "safeSearch": "Strict",
              }
          )
          request = urllib.request.Request(
              search_url,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              page_bytes = response.read(8 * 1024 * 1024)
              page_status = response.status
              page_content_type = response.headers.get("Content-Type", "")
          page_text = page_bytes.decode("utf-8", errors="replace")
          (output / "search-page.html").write_text(page_text, encoding="utf-8")

          root = lxml_html.fromstring(page_text)
          candidates = []
          for node in root.xpath("//a[contains(concat(' ', normalize-space(@class), ' '), ' iusc ')][@m]"):
              try:
                  metadata = json.loads(html_std.unescape(node.attrib["m"]))
              except Exception:
                  continue
              image_url = metadata.get("murl")
              source_url = metadata.get("purl")
              if not isinstance(image_url, str) or not image_url.startswith(("http://", "https://")):
                  continue
              candidates.append(
                  {
                      "image_url": image_url,
                      "source_url": source_url,
                      "title": metadata.get("t"),
                      "thumbnail_url": metadata.get("turl"),
                  }
              )

          selected = None
          failures = []
          for candidate in candidates[:40]:
              try:
                  image_request = urllib.request.Request(
                      candidate["image_url"],
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                          "Referer": search_url,
                      },
                  )
                  with urllib.request.urlopen(image_request, timeout=30) as response:
                      content_type = response.headers.get("Content-Type", "").split(";", 1)[0].strip().lower()
                      declared = response.headers.get("Content-Length")
                      if declared and int(declared) > MAX_BYTES:
                          raise ValueError(f"declared image too large: {declared}")
                      data = response.read(MAX_BYTES + 1)
                  if len(data) > MAX_BYTES:
                      raise ValueError("image exceeded byte limit")
                  if not content_type.startswith("image/"):
                      raise ValueError(f"unexpected content type: {content_type}")

                  with Image.open(BytesIO(data)) as image:
                      image.verify()
                  with Image.open(BytesIO(data)) as image:
                      width, height = image.size
                      image_format = (image.format or "").upper()
                  if width < 400 or height < 250:
                      raise ValueError(f"image too small: {width}x{height}")

                  suffix = {
                      "JPEG": ".jpg",
                      "PNG": ".png",
                      "WEBP": ".webp",
                      "GIF": ".gif",
                      "TIFF": ".tiff",
                  }.get(image_format, ".img")
                  image_path = output / f"selected{suffix}"
                  image_path.write_bytes(data)
                  selected = {
                      **candidate,
                      "downloaded_path": image_path.as_posix(),
                      "content_type": content_type,
                      "bytes": len(data),
                      "width": width,
                      "height": height,
                      "format": image_format,
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
                  break
              except Exception as exc:
                  failures.append(
                      {
                          "image_url": candidate.get("image_url"),
                          "error": f"{type(exc).__name__}: {exc}",
                      }
                  )

          result = {
              "query": QUERY,
              "search_url": search_url,
              "search_status": page_status,
              "search_content_type": page_content_type,
              "search_page_bytes": len(page_bytes),
              "candidate_count": len(candidates),
              "selected": selected,
              "first_failures": failures[:10],
          }
          (output / "result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("BING_IMAGE_SMOKE_RESULT=" + json.dumps(result, ensure_ascii=False))
          if selected is None:
              raise SystemExit("Bing returned no downloadable, valid original image")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bing-image-http-smoke
          path: bing-smoke/
          if-no-files-found: error
          retention-days: 3

  codex-bing-smoke:
    needs: bing-http-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ORCHESTRATOR_MODEL: ${{ vars.ORCHESTRATOR_MODEL }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install migrated runtime
        run: python -m pip install -r requirements.txt
      - name: Run a real network-enabled ASSETS task through Agents SDK and Codex
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}${CODEX_API_KEY}" ]; then
            echo "CODEX_BING_SMOKE=SKIPPED_NO_CREDENTIAL"
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import os
          from pathlib import Path
          import shutil

          from PIL import Image

          from src.orchestration.codex_runtime import OpenAICodexExecutor
          from src.orchestration.models import CodexTaskSpec, StageName

          workspace = Path("codex-bing-smoke").resolve()
          shutil.rmtree(workspace, ignore_errors=True)
          (workspace / "inputs").mkdir(parents=True)
          (workspace / "drafts").mkdir(parents=True)
          (workspace / "AGENTS.md").write_text(
              "# Bounded test\nWrite only md/** and assets/**. Never modify inputs or drafts. "
              "Do not hotlink. Keep source-page and licence provenance.\n",
              encoding="utf-8",
          )
          (workspace / "inputs" / "manifest.json").write_text(
              json.dumps({"schema_version": 2, "files": []}, indent=2),
              encoding="utf-8",
          )
          (workspace / "project_brief.md").write_text(
              "Create one local, attributable medical-education image for an ECG guide.\n",
              encoding="utf-8",
          )
          (workspace / "plan.json").write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "project_title": "Bing image smoke",
                      "audience": "medical students",
                      "language": "en",
                      "objectives": ["test local image sourcing"],
                      "sections": [
                          {
                              "id": "ecg",
                              "title": "ECG electrode placement",
                              "objective": "show standard 12-lead electrode placement",
                              "estimated_words": 200,
                              "required_evidence": [],
                              "visual_opportunities": ["electrode placement diagram"],
                          }
                      ],
                      "quality_contract": {},
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          (workspace / "drafts" / "ecg.md").write_text(
              "## ECG electrode placement\n\n"
              "A local diagram should illustrate standard precordial lead positions.\n\n"
              ":::visual {\"id\":\"ecg-bing\",\"action\":\"SEARCH_WEB\","
              "\"reason\":\"real-world educational diagram\","
              "\"description\":\"standard 12-lead ECG chest electrode placement\"}\n:::\n",
              encoding="utf-8",
          )

          prompt = """
          You are testing the ASSETS network path. Read AGENTS.md and drafts/ecg.md.
          Use Bing Images explicitly, with the query:
          `12 lead ECG electrode placement diagram site:commons.wikimedia.org`.
          Select a medically accurate image from Wikimedia Commons or another source
          with an explicit reusable licence. Open the source page, verify the licence,
          then download the original image into assets/. Do not save a search-result
          thumbnail and do not hotlink. Create md/ecg.md with a local image reference.
          Create assets/asset-manifest.json using schema_version 2. The asset entry must
          contain id, source, path, caption, alt_text, provenance, licence, used_in,
          sha256, plus search_engine="bing", search_query, source_page_url, and
          original_image_url. Write only md/** and assets/**. Return the required
          structured result after checking that the downloaded file is a valid image.
          """.strip()

          executor = OpenAICodexExecutor(
              orchestrator_model=os.getenv("ORCHESTRATOR_MODEL") or "gpt-5.6-luna",
              codex_model=os.getenv("CODEX_MODEL") or "gpt-5.3-codex",
          )
          result = asyncio.run(
              executor.execute(
                  CodexTaskSpec(
                      task_id="bing-assets-smoke",
                      stage=StageName.ASSETS,
                      workspace=workspace,
                      prompt=prompt,
                      allowed_paths=["md/**", "assets/**"],
                      required_outputs=["md/ecg.md", "assets/asset-manifest.json"],
                      allow_network=True,
                      reasoning_effort="high",
                      idle_timeout_seconds=900,
                  )
              )
          )
          print("CODEX_BING_RESULT=" + result.model_dump_json())
          if result.status != "completed":
              raise SystemExit("Codex did not complete the Bing asset task")

          manifest_path = workspace / "assets" / "asset-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries = manifest.get("assets", [])
          if not entries:
              raise SystemExit("asset manifest contains no entries")
          entry = entries[0]
          if str(entry.get("search_engine", "")).casefold() != "bing":
              raise SystemExit("manifest does not prove Bing was used")
          asset_path = workspace / str(entry["path"])
          with Image.open(asset_path) as image:
              image.verify()
          if not (workspace / "md" / "ecg.md").is_file():
              raise SystemExit("resolved markdown was not created")
          print(
              "CODEX_BING_MANIFEST="
              + json.dumps(
                  {
                      "entry": entry,
                      "asset_bytes": asset_path.stat().st_size,
                  },
                  ensure_ascii=False,
              )
          )
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: codex-bing-image-smoke
          path: codex-bing-smoke/
          if-no-files-found: ignore
          retention-days: 3
