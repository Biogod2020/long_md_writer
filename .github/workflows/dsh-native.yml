name: LongWriter architecture and compatibility

on:
  push:
    branches: [master, "agent/**"]
    paths:
      - "packages/**"
      - "adapters/**"
      - "skills/**"
      - "dsh-native/**"
      - "test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "docs/ARCHITECTURE.md"
      - "docs/MIGRATION.md"
      - ".github/workflows/dsh-native.yml"
  pull_request:
    paths:
      - "packages/**"
      - "adapters/**"
      - "skills/**"
      - "dsh-native/**"
      - "test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "docs/ARCHITECTURE.md"
      - "docs/MIGRATION.md"
      - ".github/workflows/dsh-native.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --no-frozen-lockfile --strict-peer-dependencies=false
      - run: pnpm check
      - run: pnpm test
      - name: Import the MCP v2 server package
        run: pnpm --filter @longwriter/mcp exec node -e "import('./src/server.js').then(m => { if (typeof m.buildServer !== 'function') process.exit(1) })"

  dsh-adapter:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --no-frozen-lockfile --strict-peer-dependencies=false
      - run: pnpm --filter @longwriter/adapter-dsh test:integration
      - name: Compose and boot the compatibility bundle through DSH 0.1.0-rc.6
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          npm install --global @deepseek-ai/dsh@0.1.0-rc.6
          dsh plugin --profile web add ./dsh-native
          dsh --profile web --dump-config > "$RUNNER_TEMP/longwriter-config.yml"
          grep -q "longwriter-native" "$RUNNER_TEMP/longwriter-config.yml"

          dsh --profile web --port 3098 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          DSH_PID=$!
          cleanup() {
            kill "$DSH_PID" 2>/dev/null || true
            wait "$DSH_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3098/ > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$DSH_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi

  latest-dsh-warning:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm view @deepseek-ai/dsh@next version
      - run: npm view @deepseek-ai/dsh-tools@next version
