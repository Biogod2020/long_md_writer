name: DSH-native compatibility

on:
  push:
    branches: [master, "agent/**"]
    paths:
      - "AGENTS.md"
      - "dsh-native/**"
      - "docs/DSH_NATIVE_ARCHITECTURE.md"
      - ".github/workflows/dsh-native.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "dsh-native/**"
      - "docs/DSH_NATIVE_ARCHITECTURE.md"
      - ".github/workflows/dsh-native.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  portable-domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - run: pnpm run check:imports
      - run: pnpm test

  pinned-dsh:
    # The plugin contract exercises CoreText geometry preflight; run the full
    # DSH composition on macOS rather than treating an approximate renderer as
    # acceptance evidence.
    runs-on: macos-14
    defaults:
      run:
        working-directory: dsh-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies=false
      - run: pnpm run check:imports
      - run: pnpm run test:dsh-contract
      - run: pnpm test
      - name: Compose and boot the out-of-tree bundle through DSH 0.1.1-rc.2
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          npm install --global @deepseek-ai/dsh@0.1.1-rc.2
          dsh plugin --profile web add .
          dsh --profile web --dump-config > "$RUNNER_TEMP/longwriter-config.yml"
          grep -q "longwriter-native" "$RUNNER_TEMP/longwriter-config.yml"
          grep -q "sessions-longwriter/dsh-0.1.1-rc.2" "$RUNNER_TEMP/longwriter-config.yml"

          dsh --profile web --no-open --port 3098 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          DSH_PID=$!
          cleanup() {
            kill "$DSH_PID" 2>/dev/null || true
            wait "$DSH_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3098/ > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$DSH_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi

  release-warning:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report the published DSH package-family releases without changing the pin
        run: |
          npm view @deepseek-ai/dsh version
          npm view @deepseek-ai/dsh-tools version
          npm view @deepseek-ai/dsh-llm version
