name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_codex_smoke:
        description: Run credentialed Codex smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile and test deterministic control plane
        run: |
          python -m compileall -q src scripts tests main.py main_markdown.py app.py
          pytest -q -m "not integration"
          python main.py --help >/dev/null
          python main_markdown.py --help >/dev/null
          python -m src.orchestration.validate_cli --help >/dev/null

  browser-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify independent browser evidence
        run: pytest -q tests/integration/test_browser_probe.py

  codex-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_codex_smoke
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require a credential
        run: test -n "$OPENAI_API_KEY$CODEX_API_KEY"
      - name: Run real Agents SDK to Codex delegation
        run: pytest -q tests/integration/test_codex_smoke.py
