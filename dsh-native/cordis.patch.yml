# LongMDWriter is an out-of-tree DSH bundle. It layers domain tools and policy
# over @deepseek-ai/dsh-base without modifying the harness core.

# Keep session artifacts isolated by the exact DSH format owner. A future DSH
# version gets a new namespace rather than opening these logs in place.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions-longwriter/dsh-0.1.1-rc.2')

# Keep the model-facing tool protocol in native mode so Code Mode cannot route
# around the publication mutation boundary.
- id: tools
  config:
    mode: native

# Optional repository search. Install dsh-bing-search separately and set this
# variable to its absolute executable path. Keeping the entry disabled when the
# variable is absent preserves a portable bundle and avoids a hard-coded host
# path. Leave it unset when the same MCP server is mounted elsewhere.
- insert:
    - id: longwriter-mcp-web
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.LONGWRITER_DSH_SEARCH_BIN"
      config:
        serverName: web
        transport: stdio
        command: !!js process.env.LONGWRITER_DSH_SEARCH_BIN ?? ''
        args: []
        toolCallTimeoutMs: 30000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

# Domain completion is evaluator-gated. Do not expose model-controlled goal
# completion or generic orchestration surfaces in this dedicated profile.
- id: tool-goal
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true

# Shell access can bypass manuscript-scoped mutation tools. Validation and
# reviewer execution are owned inside this bundle, so the root writer does not
# need a model-facing shell.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- insert:
    - id: longwriter-native
      name: long-md-writer-dsh-native
