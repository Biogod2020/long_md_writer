<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="60" text-anchor="middle" font-family="Helvetica" font-size="28" font-weight="700" fill="#0f172a">Negative feedback corrects deviations</text>
  <text x="480" y="91" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#475569">The comparator forms e(t) = r(t) − y(t)</text>
  <line x1="86" y1="250" x2="232" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="138" y="224" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0f172a">Setpoint r(t)</text>
  <circle cx="260" cy="250" r="27" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="260" y="257" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0f172a">Σ</text>
  <text x="226" y="241" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0f172a" data-allow-overlap="true">+</text>
  <text x="248" y="290" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0f172a" data-allow-overlap="true">−</text>
  <line x1="287" y1="250" x2="350" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="318" y="224" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#334155">e(t)</text>
  <rect x="350" y="196" width="170" height="108" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="435" y="244" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0f172a">Controller</text>
  <text x="435" y="273" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#334155">C(s)</text>
  <line x1="520" y1="250" x2="610" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="565" y="224" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#334155">u(t)</text>
  <rect x="610" y="196" width="170" height="108" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="695" y="244" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0f172a">Process</text>
  <text x="695" y="273" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#334155">P(s)</text>
  <line x1="780" y1="250" x2="900" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="850" cy="250" r="6" fill="#334155"/>
  <text x="850" y="224" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0f172a">Output y(t)</text>
  <line x1="695" y1="132" x2="695" y2="188" stroke="#d97706" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="695" y="120" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#9a3412">Disturbance d(t)</text>
  <polyline points="850,256 850,410 260,410 260,278" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="555" y="397" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#1d4ed8">Feedback measurement</text>
</svg>
