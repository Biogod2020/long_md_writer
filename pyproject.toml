[project]
name = "long-md-writer"
version = "3.0.0"
description = "Bounded long-form publication workflow using OpenAI Agents SDK and Codex"
requires-python = ">=3.10"
dependencies = [
  "openai-agents==0.18.3",
  "pydantic>=2.12.2,<3",
  "lxml>=5.0,<7",
  "Pillow>=10.0,<13",
  "playwright>=1.50,<2",
  "rich>=13.0,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]
gui = ["streamlit>=1.40,<2"]

[project.scripts]
long-md-writer = "scripts.main:main"
long-md-writer-markdown = "scripts.main_markdown:main"
long-md-writer-validate = "src.orchestration.validate_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires live credentials or external runtime dependencies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
