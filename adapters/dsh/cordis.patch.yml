# Optional DSH runtime policy. LongWriter domain state remains in @longwriter/core.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions-longwriter/dsh-0.1.0-rc.6')

- id: compaction-basic
  config:
    thresholdRatio: 0.75
    retainRatio: 0.20
    maxTokens: 8192
    compactionRetries: 1
    maxOverflowRetries: 1
    auto: true

- id: tools
  config:
    mode: native

- id: tool-goal
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- insert:
    - id: longwriter-native
      name: @longwriter/adapter-dsh
